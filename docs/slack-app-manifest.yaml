# Copy of web/public/slack-app-manifest.yaml — Settings links the public file.
# Create the app from a manifest at https://api.slack.com/apps then replace
# YOUR-JOEL-ORIGIN with this install's URL (Settings → Slack bot shows it).

display_information:
  name: joel
  description: Company brain for this workspace. Answers @mentions from your own memory.
  background_color: "#1a1a1a"
features:
  bot_user:
    display_name: joel
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    request_url: https://YOUR-JOEL-ORIGIN/api/slack/events
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
    request_url: https://YOUR-JOEL-ORIGIN/api/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false

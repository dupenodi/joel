services:
  joel-api:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - joel-data:/app/data
    environment:
      JOEL_DATA: /app/data
      JOEL_WEB_ORIGIN: http://localhost:3000
      JOEL_HTTPS: "0"
      # JOEL_SECRET: set in a real deploy — encrypts connector credentials
      # HYDRA_HTTP / HYDRA_BOLT / HYDRA_TOKEN: required for graph features
  joel-web:
    build:
      context: ./web
      args:
        JOEL_API_INTERNAL: http://joel-api:8000
    ports:
      - "3000:3000"
    environment:
      JOEL_API_INTERNAL: http://joel-api:8000
      # Browser calls same-origin /api → Next rewrites to joel-api
      NEXT_PUBLIC_API: ""
    depends_on:
      - joel-api

volumes:
  joel-data:
